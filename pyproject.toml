[project]
name = "quotedesk"
version = "0.1.0"
description = "Email quote request -> extracted lines -> catalogue match over MCP -> priced quote PDF -> human approval"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "crewai>=1.15.28",
    "crewai-tools[mcp]>=1.15.28",
    "fastapi>=0.159.1",
    "fastembed>=0.9.0",
    "fpdf2>=2.8.9",
    "google-genai>=2.32.0",
    "httpx>=0.28.1",
    "mcp>=1.28.1",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pydantic-settings>=2.16.1",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
ui = [
    "httpx>=0.28.1",
    "streamlit>=1.66.1",
]

[tool.uv]
default-groups = ["dev", "ui"]  # locally: everything
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = ["C408"]  # dict(key=...) reads better for the fixture tables
